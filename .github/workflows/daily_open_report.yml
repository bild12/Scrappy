name: "🌅 CNL — Daily Open Report (09:45 EST)"

on:
  schedule:
    # 09:45 AM EST = 14:45 UTC (standard time) | 13:45 UTC (daylight saving)
    # Using 14:15 UTC to be safe for both seasons
    - cron: "15 14 * * 1-5"   # Monday–Friday only

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      force_send:
        description: "Force send even without alerts"
        required: false
        default: false
        type: boolean

jobs:
  morning-report:
    name: "Morning Open Report"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "🐍 Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "📦 Install dependencies"
        run: pip install -r requirements.txt

      - name: "🌅 Run Morning Alert Check"
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          RESEND_API_KEY:     ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_FROM:   ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO:     ${{ secrets.ALERT_EMAIL_TO }}
          PRICE_ALERT_THRESHOLD:   "3.0"
          VOLUME_ALERT_MULTIPLIER: "2.0"
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_send }}" == "true" ]; then
            FORCE_FLAG="--force"
          fi
          python scripts/run_alerts.py --mode open $FORCE_FLAG
